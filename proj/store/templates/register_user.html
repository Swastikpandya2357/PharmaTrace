{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Retailer Registration - PharmaTrace SCN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="{% static 'css/style.css' %}" rel="stylesheet" type="text/css" media="all" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <div class="main-w3layouts wrapper">
    <div style="text-align: center;">
      <span class="scn-badge" style="background-color: #dcfce7; color: #166534;"><i class="fas fa-store"></i> Retailer Onboarding</span>
    </div>
    <h1>Retailer Registration</h1>
    <p class="portal-subtitle">Join SCN to Direct-Order from Verified Distributors</p>

    <div class="main-agileinfo">
      <div class="agileits-top">
        {% if error %}
          <div class="alert-scn alert-scn-danger">
            <i class="fas fa-exclamation-circle"></i> {{ error }}
          </div>
        {% endif %}

        <form action="{% url 'register_user' %}" method="post">
          {% csrf_token %}
          <label style="font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 0.35rem; display: block;">Store / Retailer Name</label>
          <input type="text" name="Username" value="{{ request.POST.Username|default:'' }}" placeholder="e.g. Metro Electronics Retail" required>

          <label style="font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 0.35rem; display: block;">Retailer Email</label>
          <input type="email" name="email" value="{{ request.POST.email|default:'' }}" placeholder="retailer@example.com" required>

          <label style="font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 0.35rem; display: block;">Password</label>
          <input type="password" name="password" placeholder="Create password" required>

          <label style="font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 0.35rem; display: block;">Confirm Password</label>
          <input type="password" name="confirm_pass" placeholder="Confirm password" required>

          <div class="wthree-text">
            <label class="anim">
              <input type="checkbox" class="checkbox" checked required>
              <span>I agree to transparent SCN ledger records & tracking</span>
            </label>
          </div>

          <input type="submit" value="REGISTER RETAILER STORE" style="background-color: #166534; border-color: #166534;">
        </form>

        <p>Already have an account? <a href="{% url 'login_user' %}">Retailer Login</a></p>
        <p style="margin-top: 0.5rem;"><a href="{% url 'dashboard' %}"><i class="fas fa-arrow-left"></i> Back to Dashboard</a></p>
      </div>
    </div>
  </div>
</body>
</html>
