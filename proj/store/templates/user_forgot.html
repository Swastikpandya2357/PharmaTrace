{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Retailer Forgot Password - SCN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="{% static 'css/style.css' %}" rel="stylesheet" type="text/css" media="all" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <div class="main-w3layouts wrapper">
    <div style="text-align: center;">
      <span class="scn-badge" style="background-color: #dcfce7; color: #166534;"><i class="fas fa-key"></i> Retailer Security</span>
    </div>
    <h1>Retailer Password Recovery</h1>
    <p class="portal-subtitle">We will send a 6-digit verification OTP to your registered email address</p>

    <div class="main-agileinfo">
      <div class="agileits-top">
        {% if error %}
          <div class="alert-scn alert-scn-danger">
            <i class="fas fa-exclamation-circle"></i> {{ error }}
          </div>
        {% endif %}

        <form action="{% url 'forgot_password_user' %}" method="post">
          {% csrf_token %}
          <label style="font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 0.35rem; display: block;">Registered Retailer Email</label>
          <input type="email" name="email" value="{{ request.POST.email|default:'' }}" placeholder="retailer@example.com" required>

          <input type="submit" value="SEND SECURITY OTP TO EMAIL" style="background-color: #166534; border-color: #166534;">
        </form>

        <p><a href="{% url 'login_user' %}"><i class="fas fa-arrow-left"></i> Back to Retailer Login</a></p>
      </div>
    </div>
  </div>
</body>
</html>
