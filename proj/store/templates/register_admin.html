{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Admin Registration - PharmaTrace SCN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="{% static 'css/style.css' %}" rel="stylesheet" type="text/css" media="all" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <div class="main-w3layouts wrapper">
    <div style="text-align: center;">
      <span class="scn-badge"><i class="fas fa-user-shield"></i> Platform Authority</span>
    </div>
    <h1>Admin Registration</h1>
    <p class="portal-subtitle">Create SCN Network Administrator Account</p>

    <div class="main-agileinfo">
      <div class="agileits-top">
        {% if error %}
          <div class="alert-scn alert-scn-danger">
            <i class="fas fa-exclamation-circle"></i> {{ error }}
          </div>
        {% endif %}

        <form action="{% url 'register_admin' %}" method="post">
          {% csrf_token %}
          <label style="font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 0.35rem; display: block;">Full Name / Admin Username</label>
          <input type="text" name="name" value="{{ request.POST.name|default:'' }}" placeholder="e.g. Swastik Pandya" required>

          <label style="font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 0.35rem; display: block;">Official Email</label>
          <input type="email" name="email" value="{{ request.POST.email|default:'' }}" placeholder="name@example.com" required>

          <label style="font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 0.35rem; display: block;">Password</label>
          <input type="password" name="pass" placeholder="Enter password" required>

          <label style="font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 0.35rem; display: block;">Confirm Password</label>
          <input type="password" name="con_pass" placeholder="Re-enter password" required>

          <div class="wthree-text">
            <label class="anim">
              <input type="checkbox" class="checkbox" checked required>
              <span>I confirm administrative compliance with SCN protocol</span>
            </label>
          </div>

          <input type="submit" value="REGISTER ADMIN ACCOUNT">
        </form>

        <p>Already have an admin account? <a href="{% url 'login_admin' %}">Admin Login</a></p>
        <p style="margin-top: 0.5rem;"><a href="{% url 'dashboard' %}"><i class="fas fa-arrow-left"></i> Back to Dashboard</a></p>
      </div>
    </div>
  </div>
</body>
</html>
