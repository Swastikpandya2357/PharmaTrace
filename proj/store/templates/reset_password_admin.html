{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Reset Admin Password - SCN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="{% static 'css/style.css' %}" rel="stylesheet" type="text/css" media="all" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>

<body>
  <div class="main-w3layouts wrapper">
    <div style="text-align: center;">
      <span class="scn-badge"><i class="fas fa-lock"></i> Password Reset</span>
    </div>
    <h1>Admin Reset Password</h1>
    <p class="portal-subtitle">Create a new secure password for <strong>{{ email }}</strong></p>

    <div class="main-agileinfo">
      <div class="agileits-top">
        {% if error %}
        <div class="alert-scn alert-scn-danger">
          <i class="fas fa-exclamation-circle"></i> {{ error }}
        </div>
        {% endif %}

        <form action="{% url 'reset_password_admin' %}" method="post">
          {% csrf_token %}
          <input type="hidden" name="email" value="{{ email }}">

          <label
            style="font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 0.35rem; display: block;">New
            Password</label>
          <input type="password" name="password" placeholder="Enter new password" required>

          <label
            style="font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 0.35rem; display: block;">Confirm
            New Password</label>
          <input type="password" name="confirm_password" placeholder="Re-enter new password" required>

          <input type="submit" value="UPDATE PASSWORD & LOG IN">
        </form>

        <p><a href="{% url 'login_admin' %}"><i class="fas fa-arrow-left"></i> Cancel</a></p>
      </div>
    </div>
  </div>
</body>

</html>
